apply from: "$project.rootDir/jacoco_common.gradle"

project.tasks.register("jacocoUnitTestReport", JacocoReport) {
    if (isTestableAndroid(project)) {
        dependsOn(tasks.named("jacocoAdrTestReport"))
    } else if (isTestableJava(project)) {
        dependsOn(tasks.named("jacocoJarTestReport"))
    }
}

task jacocoAdrTestReport(type: JacocoReport, dependsOn: 'testDebugUnitTest') {
    reports{
        xml.required = true
        html.required = true
    }

    def jacocoFileFilter = [
            '**/R.class',
            '**/BR.class',
            '**/R$*.class',
            '**/*$ViewInjector*.*',
            '**/*$ViewBinder*.*',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            // Ignore Dagger 2 generated code
            '**/Dagger*.class',
            '**/**_MembersInjector*.class',
            '**/**Module_*.class',
            '**/**_Factory*.class',
            '**/**_ViewBinding*.class',
            '**/**Binding*.class',
            'android/databinding/**',
            'android/databinding/**/*.class',
            '**/android/databinding/*Binding.class',
            '**/*Module.class',
            '**/*Component.class',
            '**/Mock*.class',
            '**/DataBinderMapperImpl.class',
            '**/DataBinderMapperImpl$*.class',
            '**/generated/*',
            '**/*$grab_*',
            'kotlinx/*',
            '**/androidTest/*',
            '**/*$DefaultImpls.class',
            // ignore Parcelable creator classes
            '**/*$Creator.class',
            '**/*$CREATOR.class',
            // ignoring DI packages
            '**/di/**',
            // '**/widgets',
    ]


    def kotlinDebugTree = provider {
        fileTree(dir: tasks.named('compileDebugKotlin').get().destinationDirectory, excludes: jacocoFileFilter)
    }
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.from = files([mainSrc])
    classDirectories.from = files([kotlinDebugTree])
    executionData.from = layout.buildDirectory.file("jacoco/testDebugUnitTest.exec")

    def moduleName = project.name
    def root = project.rootProject
    def coverageDir = root.file("build")
    def coverageFile = root.file("build/temp_ut_coverage.txt")
    doLast {
        def report = printReport(moduleName, reports)
        root.utCoveredLine = root.utCoveredLine.toLong() + report.covered
        root.utTotalLine = root.utTotalLine.toLong() + report.total
        double ratio = root.utCoveredLine.doubleValue() / root.utTotalLine.doubleValue() * 100
        def formatStr = '%.2f%%'
        def ratioStr = String.format(formatStr, ratio)
        def dir = coverageDir
        if (!dir.exists()) {
            dir.mkdir()
        }
        def file = coverageFile
        if (!file.exists()) {
            file.createNewFile()
        }
        file.write ratioStr
    }
}

