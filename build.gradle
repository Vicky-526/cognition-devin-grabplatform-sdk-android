buildscript {
    apply from: 'dependencies.gradle'
    ext{
        dokka_version = '2.2.0'
        publish_plugin_version = '2.0.0'
        utCoveredLine = 0L
        utTotalLine = 0L
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "com.android.tools.build:gradle-kotlin:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "io.github.gradle-nexus:publish-plugin:$publish_plugin_version"
        classpath("org.jetbrains.dokka:dokka-gradle-plugin:${dokka_version}")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs 'libs'
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

apply from: 'GrabIdPartnerSDK/scripts/base-publish.gradle'

task printTotalUTCoverage() {
    def file = rootProject.file("build/temp_ut_coverage.txt")
    doLast {
        if (file.exists()) {
            def output = file.text
            file.delete()
            println output
        } else {
            println '0.0%'
        }
    }
}

